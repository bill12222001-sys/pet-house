<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe3f0">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>口袋小寵物屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-sized room — header, pet room stage, care meters, action dock; sheets slide up for food, shop, adopt. Single deliberate look (sunny pet room), no dark variant. */
:root{
  --wall:#bfe3f0; --wall-night:#2f3d6b; --floor:#f2c29a; --floor-line:#e3a97c;
  --ink:#2b3445; --ink-soft:#5f6b7f; --panel:#ffffff; --panel-2:#eef6f9;
  --coral:#ff7a59; --gold:#f2b51f; --leaf:#4fae63; --sky:#3d9bd6; --plum:#9a6fd6;
  --line:#d6e4ea;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Noto Sans TC",ui-rounded,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#e4f2f6;color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-num);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,var(--gold) 60%,#c98d00);display:grid;place-items:center;font-size:12px;color:#8a5a00;font-weight:800}
.hdr-r{display:flex;align-items:center;gap:8px}
.music{display:flex;align-items:center;gap:4px;border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:4px 10px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.music #musicIc{font-size:16px;display:inline-block}
.music[aria-pressed="true"] #musicIc{animation:dance .6s ease-in-out infinite alternate;color:var(--coral)}
.music[aria-pressed="false"]{color:var(--ink-soft);border-color:#9aa6b0}
.music:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@keyframes dance{from{transform:rotate(-14deg) translateY(1px)}to{transform:rotate(14deg) translateY(-2px)}}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-6px}
.now-playing{font-size:13px;color:var(--ink-soft);min-height:1.2em;min-width:0}
.store{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.store.none{border-color:#d83b2f;color:#d83b2f;background:#fff1ef}
.store:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
textarea{font:inherit;font-size:13px;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;width:100%;resize:vertical;word-break:break-all}
.warn{color:#d83b2f;font-weight:700}
.store.due{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:none}}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .btn{flex:1 1 140px}
.sec{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:15px;font-weight:900}
.filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 10px 4px 4px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tab svg{width:30px;height:30px}
.tab[aria-selected="true"]{border-color:var(--coral);background:#fff3ee}
.tab.add{padding:6px 12px;color:var(--ink-soft);border-style:dashed}
.stage{contain:layout paint;isolation:isolate;position:relative;height:270px;border-radius:22px;overflow:hidden;background:var(--wall);border:3px solid var(--ink);transition:background .6s}
.stage.night{background:var(--wall-night)}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,var(--floor) 0 46px,var(--floor-line) 46px 48px);border-top:3px solid var(--ink)}
.window{position:absolute;left:18px;top:18px;width:70px;height:62px;border:3px solid var(--ink);border-radius:10px;background:#fff7d6;overflow:hidden}
.night .window{background:#1b2347}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--ink),var(--ink)) center/3px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 3px no-repeat}
.sun{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--gold)}
.night .sun{background:#f4f1c6;box-shadow:-5px -3px 0 0 #1b2347 inset}
.meal-badge{z-index:3;position:absolute;right:12px;top:12px;background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;max-width:60%}
.meal-badge.on{background:#fff0c2}
.pet-wrap{z-index:2;position:absolute;left:50%;bottom:8%;width:190px;height:190px;transform:translateX(-50%);cursor:pointer}
.pet{will-change:transform;width:100%;height:100%;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 95%}
.pet.jump{animation:hop .55s ease-out 2}
.pet.sleep{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{30%{transform:translateY(-34px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
.need{z-index:3;position:absolute;left:calc(50% + 62px);bottom:calc(8% + 160px);background:var(--panel);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:3px 8px;font-size:20px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.zzz{z-index:3;position:absolute;left:calc(50% + 50px);bottom:calc(8% + 150px);font-family:var(--f-num);font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.zzz span{display:inline-block;animation:z 2s ease-in-out infinite}
.zzz span:nth-child(2){animation-delay:.4s;font-size:20px}.zzz span:nth-child(3){animation-delay:.8s;font-size:15px}
@keyframes z{0%,100%{opacity:.2;transform:translateY(4px)}50%{opacity:1;transform:translateY(-6px)}}
.float{will-change:transform,opacity;z-index:5;position:absolute;left:50%;bottom:55%;transform:translateX(-50%);font-weight:900;font-size:17px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap;pointer-events:none;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.bubble{will-change:transform,opacity;position:absolute;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 30% 30%,#fff,rgba(160,215,255,.5));pointer-events:none;animation:rise 1.8s ease-out forwards}
@keyframes rise{to{transform:translateY(-120px) scale(1.3);opacity:0}}
.ball{will-change:transform;position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--coral) 0 25%,#fff 0 50%,var(--sky) 0 75%,#fff 0);cursor:pointer;animation:pop .2s ease-out;z-index:3}
@keyframes pop{from{transform:scale(0)}}
.game-hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;z-index:4;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.name-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name-row b{font-size:19px;font-weight:900}
.species{color:var(--ink-soft);font-size:13px;margin-left:6px}
.lv{font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--coral)}
.meter{display:grid;grid-template-columns:3.4em 1fr 2.4em;align-items:center;gap:8px;font-size:14px}
.meter .bar{height:12px;border-radius:999px;background:var(--panel-2);border:2px solid var(--ink);overflow:hidden}
.meter .fill{height:100%;border-radius:999px;transition:width .5s}
.meter .num{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.meter.low .num{color:#d83b2f;font-weight:800}
.xp .fill{background:repeating-linear-gradient(45deg,var(--gold) 0 8px,#ffd35c 8px 16px)}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.act{border:2px solid var(--ink);background:var(--panel);border-radius:16px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.act .ic{font-size:24px;line-height:1}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.act:focus-visible,.tab:focus-visible,.item button:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.act.on{background:#fff0c2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
.toast.levelup{background:var(--coral);font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(30,40,60,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:82%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;border:3px solid var(--ink);border-bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:.4}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:18px;font-weight:900}
.x{border:0;background:var(--panel-2);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
.meals{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.chip.done{border-color:var(--leaf);color:var(--leaf);background:#eaf7ec}
.chip.now{border-color:var(--gold);color:#8a5a00;background:#fff0c2}
.hint{font-size:13px;color:var(--ink-soft);margin:0}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.item .emo{font-size:30px;line-height:1}
.item .t{font-weight:900}
.item .d{font-size:12px;color:var(--ink-soft);min-height:2.6em}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.item .own{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.item button,.btn{border:2px solid var(--ink);border-radius:12px;background:var(--coral);color:#fff;font:inherit;font-weight:900;padding:5px 12px;cursor:pointer}
.item button:disabled,.btn:disabled{background:#c9d3da;color:#6c7884;border-color:#9aa6b0;cursor:not-allowed}
.item.lux{border-color:var(--gold);background:#fffaf0}
.price{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:800}
.price .coin{width:18px;height:18px;font-size:10px}
.adopt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:8px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.pick[aria-pressed="true"]{border-color:var(--coral);background:#fff3ee}
.pick svg{width:90px;height:90px}
.pick b{font-weight:900}.pick small{color:var(--ink-soft);font-size:12px;text-align:center}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
input[type=text]{font:inherit;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:16px}
.fest{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px dashed var(--gold);border-radius:16px;padding:8px 10px 8px 12px}
.fest.on{border-style:solid;background:#fff6dc}
.fest .fe{font-size:28px;line-height:1}
.fest .ft{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--ink-soft)}
.fest .ft b{font-size:15px;font-weight:900;display:block;color:var(--ink)}
.fest .btn{flex:0 0 auto;font-size:14px}
.btn.ghost,.item .row button.off{background:var(--panel);color:var(--ink)}
.deco{position:absolute;pointer-events:none;z-index:1}
.deco svg{width:100%;height:100%;display:block;overflow:visible}
.slot-floorL{left:6px;bottom:10px;width:68px;height:104px}
.slot-floorR{right:6px;bottom:10px;width:72px;height:118px}
.slot-top{top:44px;left:98px;right:14px;height:58px}
.slot-rug{left:50%;bottom:3%;width:230px;max-width:80%;height:46px;transform:translateX(-50%);z-index:0}
.snow{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.snow i{position:absolute;top:-10px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 2px rgba(43,52,69,.4);animation:fall linear infinite}
@keyframes fall{to{transform:translate(24px,290px)}}
.prop,.spin,.burst{transform-box:fill-box;transform-origin:center}
.prop{animation:prop .35s linear infinite}@keyframes prop{50%{transform:scaleX(.12)}}
.spin{animation:spin 1.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 1.4s ease-in-out infinite}@keyframes tw{50%{opacity:.35}}
.glow{animation:tw 2.2s ease-in-out infinite}
.swim{animation:swim 3s ease-in-out infinite}@keyframes swim{50%{transform:translateX(10px)}}
.burst{animation:burst 1.8s ease-out infinite}@keyframes burst{0%{transform:scale(.1);opacity:1}70%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.item .pv{height:68px;display:flex;align-items:center;justify-content:center}
.item .pv svg{height:68px;width:auto;max-width:100%}
.toyic{font-size:40px;line-height:1}.toyic svg{width:40px;height:40px}
.item.hol{border-color:var(--gold);background:#fffaf0}
.tag{display:inline-block;font-size:11px;font-weight:900;color:#8a5a00;background:#ffe8a3;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.cal-row.now{border-color:var(--gold);background:#fff6dc}
.cal-row .ce{font-size:26px}.cal-row>div{min-width:0}
.cal-row .cn{font-weight:900}
.cal-row .cd{font-size:12px;color:var(--ink-soft)}
.cal-row .cs{font-size:12px;font-weight:700;white-space:nowrap}
.ball.toy{background:#fff;display:grid;place-items:center;font-size:28px;line-height:1;padding:0}
.ball.toy svg{width:32px;height:32px}
.quick{display:flex;gap:8px}
.qbtn{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:7px 8px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.qbtn b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.qbtn.ready{border-color:var(--gold);background:#fff6dc}
.qbtn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#e5484d;border:2px solid #fff}
.qbtn:focus-visible,.gcard:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.pet-wrap{--sc:1;transform:translateX(-50%) scale(var(--sc));transform-origin:50% 100%;transition:transform .6s}
.pet-wrap::before{content:"";position:absolute;inset:6% 2% -2%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s}
.pet-wrap[data-st="2"]::before{opacity:1;background:radial-gradient(circle,rgba(255,240,170,.75),rgba(255,240,170,0) 68%)}
.pet-wrap[data-st="3"]::before{opacity:1;background:radial-gradient(circle,rgba(255,214,90,.85),rgba(255,214,90,0) 70%);animation:tw 2.4s ease-in-out infinite}
.pet-wrap[data-st="3"]::after{content:"";position:absolute;right:6%;top:4%;width:30px;height:30px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:tw 1.6s ease-in-out infinite}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.task.done{border-color:var(--leaf);background:#f1faf3}
.task.all{border-style:dashed;border-color:var(--gold)}
.task .te{font-size:24px}.task .tm{min-width:0;display:flex;flex-direction:column;gap:3px}
.task small,.wrow small{font-size:12px;color:var(--ink-soft);display:block}
.tbar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}.tbar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.tg{font-size:13px;font-weight:900;color:var(--leaf);white-space:nowrap}
.book-sum{display:flex;flex-direction:column;gap:4px;font-weight:700}.book-sum b{font-family:var(--f-num);font-size:20px}
.item.locked{background:var(--panel-2);border-style:dashed}
.unk{width:56px;height:56px;border-radius:50%;background:#dfe9ee;display:grid;place-items:center;font-size:28px;font-weight:900;color:#9aa6b0}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px 10px}.wrow svg{width:48px;height:48px;flex:0 0 auto}
.wrow .up{color:var(--coral);font-weight:900}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcard{border:2px solid var(--ink);border-radius:16px;background:var(--panel);padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.gcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.gcard .ge{font-size:28px;line-height:1.1}.gcard b{font-size:16px;font-weight:900}.gcard small{font-size:12px;color:var(--ink-soft)}.gcard .best{color:var(--coral);font-weight:700}
.glist .gcard:last-child:nth-child(odd){grid-column:1/-1}
.ghud{background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;vertical-align:-2px}
.garea{position:relative;height:340px;border:3px solid var(--ink);border-radius:18px;background:var(--wall);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.g-memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;height:auto;background:#d9eef5}
.mcard{aspect-ratio:3/4;max-width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--plum);padding:0;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .15s}
.mcard .back{width:60%;height:60%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 25%,transparent 0 50%) 0 0/14px 14px}
.mcard .front{display:none}.mcard .front svg{width:70%;height:auto}
.mcard.show{background:#fff;transform:scale(1.04)}.mcard.show .back{display:none}.mcard.show .front{display:grid;place-items:center;width:100%;height:100%}
.mcard.ok{background:#eaf7ec;border-color:var(--leaf)}
.g-whack{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:12px;background:#a8d98f}
.hole{position:relative;overflow:hidden;border-radius:50% 50% 40% 40%/30% 30% 70% 70%;background:radial-gradient(ellipse at 50% 85%,#5b3a24 0 45%,#7a5235 46% 60%,transparent 61%)}
.peek{position:absolute;left:10%;width:80%;height:90%;bottom:0;border:0;background:none;padding:0;cursor:pointer;transform:translateY(100%);transition:transform .12s ease-out;display:grid;place-items:center}
.peek svg{width:100%;height:100%}.peek.up{transform:translateY(12%)}
.peek .gold{font-size:44px;color:var(--gold);text-shadow:0 2px 0 #8a5a00;line-height:1}
.bub{position:absolute;bottom:-70px;border-radius:50%;border:2px solid rgba(43,52,69,.55);padding:0;cursor:pointer;animation:rise2 linear forwards;will-change:transform}
@keyframes rise2{to{transform:translateY(-440px)}}
.bub.popd{animation:none;transform:scale(1.4);opacity:0;transition:transform .15s,opacity .15s}
.gfloat{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:900;z-index:3;pointer-events:none;animation:up 1.2s ease-out forwards}
.g-cups{background:#f6dcc2}
.cup{position:absolute;bottom:70px;width:24%;height:150px;border:0;background:none;padding:0;cursor:pointer;transition-property:left;transition-timing-function:ease-in-out}
.cupi{position:absolute;left:50%;bottom:0;width:80px;transform:translateX(-50%);transition:transform .3s;z-index:2}
.cup.lift .cupi{transform:translate(-50%,-70px)}
.cball{position:absolute;left:50%;bottom:4px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:conic-gradient(var(--coral) 0 25%,#fff 0 50%,var(--sky) 0 75%,#fff 0);border:2px solid var(--ink);visibility:hidden}
.cup.has .cball{visibility:visible}
.result{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.result .ge{font-size:44px;line-height:1}.result b{font-size:18px;font-weight:900}
.rs{font-size:16px}.rs strong{font-family:var(--f-num);font-size:34px;color:var(--coral);margin:0 4px}
.nb{display:inline-block;background:var(--gold);color:#5a3a00;font-weight:900;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:4px}
.rw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.rw span{background:var(--panel-2);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.bub{animation-duration:4s!important}}

<script>
(function(){
const SPECIES={
  bunny:{n:"雲朵兔",def:"棉棉",desc:"耳朵軟綿綿，頭上頂著一朵小雲"},
  fox:{n:"橘子狐",def:"小橘",desc:"尾巴蓬蓬，頭上長了一片葉子"},
  cat:{n:"蘑菇貓",def:"菇菇",desc:"戴著紅點點蘑菇帽的貓咪"},
  peng:{n:"布丁企鵝",def:"噗噗",desc:"搖搖擺擺，最愛玩水"}
};
const FOODS={
  rice:{n:"家常飯",e:"🍚",price:0,h:15,j:2,xp:2,d:"免費吃到飽，填飽肚子"},
  milk:{n:"溫牛奶",e:"🥛",price:2,h:10,j:6,xp:3,d:"睡前喝最舒服"},
  fruit:{n:"水果盤",e:"🍓",price:4,h:14,j:10,xp:5,d:"酸酸甜甜心情好"},
  chicken:{n:"雞腿排",e:"🍗",price:8,h:30,j:12,xp:10,d:"外皮酥脆、多汁的雞腿排"},
  iberico:{n:"伊比利豬",e:"🥓",price:15,h:40,j:18,xp:16,d:"西班牙橡果豬，油花香甜"},
  wagyu:{n:"A5 和牛",e:"🥩",price:30,h:50,j:35,xp:30,d:"最高等級和牛，入口即化",lux:1}
};
const KEY="pocketpet-v1";
const clamp=v=>Math.max(0,Math.min(100,v));
const need=lv=>40+lv*20;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};

function newPet(sp,name){return{id:Date.now()+Math.random(),sp,name:name||SPECIES[sp].def,lv:1,xp:0,h:70,c:80,e:80,j:70,sleeping:false,meals:{date:today(),b:0,l:0,d:0},wear:{},born:Date.now()}}
const localOK=(()=>{try{const k="__pp_t";localStorage.setItem(k,"1");const ok=localStorage.getItem(k)==="1";localStorage.removeItem(k);return ok}catch(e){return false}})();
const validSave=x=>x&&Array.isArray(x.pets)&&x.pets.length>0&&typeof x.coins==="number";
function migrate(x){if(x.cur>=x.pets.length)x.cur=0;x.inv=x.inv||{};x.owned=x.owned||{};x.room=x.room||{};x.claimed=x.claimed||{};if(x.toy===undefined)x.toy=null;
  x.pets.forEach(p=>{p.wear=p.wear||{};p.meals=p.meals||{date:"",b:0,l:0,d:0}});return x}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!validSave(S)){S={coins:30,inv:{milk:2,fruit:1,chicken:1,iberico:0,wagyu:0},pets:[newPet("bunny")],cur:0,last:Date.now(),fresh:true}}
migrate(S);
let storeMode=localOK?"local":"none";delete S.fresh;
const save=()=>{S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=()=>S.pets[S.cur];

/* ---------- music (original tunes, synthesized live) ---------- */
const TRACKS={
  home:{name:"🏠 小屋日常",bpm:112,
    lead:{w:"triangle",v:.16,s:"C5:2 E5:1 G5:1 A5:2 G5:2 | F5:1 E5:1 D5:1 E5:1 C5:4 | D5:2 F5:1 A5:1 G5:2 E5:2 | D5:1 C5:1 D5:1 E5:1 C5:4"},
    bass:{w:"sine",v:.18,s:"C3:4 G3:4 | F3:4 C3:4 | D3:4 G3:4 | G3:4 C3:4"},box:1},
  eat:{name:"🍱 開飯囉",bpm:132,
    lead:{w:"square",v:.06,s:"F5:1 -:1 A5:1 -:1 C6:1 A5:1 F5:2 | G5:1 -:1 A5:1 G5:1 F5:1 D5:1 C5:2 | F5:1 F5:1 A5:1 C6:1 D6:2 C6:2 | A5:1 G5:1 E5:1 G5:1 F5:4"},
    bass:{w:"triangle",v:.2,s:"F3:2 C4:2 F3:2 C4:2 | C3:2 G3:2 C3:2 G3:2 | D3:2 A3:2 Bb3:2 C4:2 | C3:2 E3:2 F3:4"},stacc:1},
  bath:{name:"🛁 泡泡浴",bpm:100,
    lead:{w:"sine",v:.2,s:"G5:1 B5:1 D6:2 B5:1 G5:1 A5:2 | E5:1 G5:1 B5:2 A5:1 G5:1 E5:2 | C5:1 E5:1 G5:2 F#5:1 G5:1 A5:2 | B5:1 A5:1 G5:1 D5:1 G5:4"},
    bass:{w:"triangle",v:.16,s:"G3:4 D3:4 | E3:4 B2:4 | C3:4 D3:4 | D3:4 G3:4"},bubbles:1},
  sleep:{name:"🌙 晚安搖籃曲",bpm:72,
    lead:{w:"sine",v:.17,s:"E5:2 G5:2 E5:2 | D5:2 C5:4 | D5:2 E5:2 G5:2 | A5:6 | G5:2 E5:2 C6:2 | B5:2 A5:4 | G5:2 E5:2 D5:2 | C5:6"},
    bass:{w:"sine",v:.13,s:"C3:6 | G2:6 | C3:6 | F3:6 | C3:6 | F3:6 | G2:6 | C3:6"},box:1,soft:1},
  play:{name:"🎾 一起玩吧",bpm:150,
    lead:{w:"square",v:.055,s:"C5:1 C5:1 G5:1 C5:1 E5:1 G5:1 C6:2 | A5:1 G5:1 E5:1 G5:1 A5:2 G5:2 | F5:1 F5:1 A5:1 F5:1 E5:1 E5:1 G5:1 E5:1 | D5:1 E5:1 F5:1 D5:1 C5:4"},
    bass:{w:"triangle",v:.2,s:"C3:1 C4:1 C3:1 C4:1 C3:1 C4:1 C3:1 C4:1 | A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 | F2:1 F3:1 F2:1 F3:1 C3:1 C4:1 C3:1 C4:1 | G2:1 G3:1 G2:1 G3:1 C3:2 C4:2"},hat:1,stacc:1},
  shop:{name:"🏪 逛逛商店",bpm:120,
    lead:{w:"triangle",v:.17,s:"D5:1 F#5:1 A5:1 F#5:1 B5:2 A5:2 | G5:1 B5:1 A5:1 G5:1 F#5:2 E5:2 | D5:1 F#5:1 A5:1 D6:1 C#6:1 B5:1 A5:2 | G5:1 E5:1 C#5:1 E5:1 D5:4"},
    bass:{w:"sine",v:.18,s:"D3:2 A3:2 D3:2 A3:2 | E3:2 B3:2 A2:2 C#3:2 | D3:2 F#3:2 G3:2 A3:2 | A2:2 C#3:2 D3:4"},hat:1}
};
const hz=n=>{const m=/^([A-G])([#b]?)(\d)$/.exec(n);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);return 440*2**((12*(+m[3]+1)+b-69)/12)};
function seq(str){const ev=[];let s=0;str.replace(/\|/g," ").trim().split(/\s+/).forEach(t=>{const[n,d]=t.split(":");if(n!=="-")ev[s]={f:hz(n),d:+d};s+=+d});return{ev,len:s}}
Object.values(TRACKS).forEach(t=>{t.L=seq(t.lead.s);t.B=seq(t.bass.s)});

const MKEY="pocketpet-music";
let musicOn=true;try{musicOn=localStorage.getItem(MKEY)!=="off"}catch(e){}
let actx=null,master=null,tGain=null,curTrack=null,nextT=0,stepN=0,noiseBuf=null;
function audioInit(){
  if(actx)return actx.state==="suspended"&&actx.resume();
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{actx=new AC()}catch(e){return}
  master=actx.createGain();master.gain.value=.55;
  const comp=actx.createDynamicsCompressor();master.connect(comp);comp.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*.2,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(tick,90);
}
function tone(f,t,dur,w,v,out,box){
  const o=actx.createOscillator(),g=actx.createGain();o.type=w;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(Math.max(v*.25,.0002),t+Math.max(.06,dur*.6));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur*.98);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur);o.onended=()=>g.disconnect();
  if(box){const o2=actx.createOscillator(),g2=actx.createGain();o2.type="sine";o2.frequency.value=f*2;
    g2.gain.setValueAtTime(v*.35,t);g2.gain.exponentialRampToValueAtTime(.0001,t+Math.min(dur,.35));o2.connect(g2);g2.connect(out);o2.start(t);o2.stop(t+.4);o2.onended=()=>g2.disconnect()}
}
function hat(t,out,v){const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=noiseBuf;f.type="highpass";f.frequency.value=7000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+.05)}
function blip(t,out){const o=actx.createOscillator(),g=actx.createGain();o.type="sine";const f=900+Math.random()*900;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.08);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+.12)}
function tick(){
  if(!actx||!musicOn||!curTrack||!tGain)return;
  const T=TRACKS[curTrack],sd=60/T.bpm/2;
  if(nextT<actx.currentTime)nextT=actx.currentTime+.05;
  while(nextT<actx.currentTime+.3){
    const li=stepN%T.L.len,bi=stepN%T.B.len,a=T.L.ev[li],b=T.B.ev[bi];
    if(a)tone(a.f,nextT,a.d*sd*(T.stacc?.7:1.1),T.lead.w,T.lead.v,tGain,T.box);
    if(b)tone(b.f,nextT,b.d*sd*(T.stacc?.8:1),T.bass.w,T.bass.v,tGain);
    if(T.hat)hat(nextT,tGain,stepN%2?.035:.06);
    if(T.bubbles&&Math.random()<.3)blip(nextT+sd*Math.random()*.5,tGain);
    stepN++;nextT+=sd;
  }
}
function setTrack(name){
  if(name===curTrack)return;curTrack=name;
  $("nowPlaying").textContent=!musicOn?"":actx?"正在播放："+TRACKS[name].name:"點一下畫面就會開始播放音樂 ♪";
  if(!actx)return;const now=actx.currentTime;
  if(tGain){const old=tGain;old.gain.cancelScheduledValues(now);old.gain.setValueAtTime(old.gain.value,now);old.gain.linearRampToValueAtTime(0,now+.5);setTimeout(()=>old.disconnect(),2500)}
  tGain=actx.createGain();tGain.gain.setValueAtTime(0,now);tGain.gain.linearRampToValueAtTime(TRACKS[name].soft?.8:1,now+.6);tGain.connect(master);
  stepN=0;nextT=now+.08;
}
function sfx(kind){
  if(!actx||!musicOn)return;const t=actx.currentTime+.02;
  const notes={level:[["C6",0],["E6",.09],["G6",.18],["C7",.3]],coin:[["B5",0],["E6",.08]],eat:[["G5",0],["C6",.1]],pop:[["E6",0]],wake:[["G5",0],["D6",.12]]}[kind];
  notes.forEach(([n,d])=>tone(hz(n),t+d,kind==="level"&&d>.25?.5:.18,"square",.07,master));
}
function setMusic(on){
  musicOn=on;
  try{localStorage.setItem(MKEY,on?"on":"off")}catch(e){}
  $("musicBtn").setAttribute("aria-pressed",on);$("musicLbl").textContent=on?"音樂開":"音樂關";$("musicIc").textContent=on?"♪":"♪̸";
  if(on){audioInit();const c=curTrack;curTrack=null;setTrack(c||"home");if(actx)master.gain.setTargetAtTime(.55,actx.currentTime,.1)}
  else{if(actx)master.gain.setTargetAtTime(0,actx.currentTime,.08);$("nowPlaying").textContent=""}
}
let openSheet=null,eatUntil=0,bathUntil=0,gaming=false;
function wantTrack(){const p=P(),n=Date.now();
  if(gaming)return"play";if(openSheet==="shop"||openSheet==="closet"||openSheet==="book")return"shop";
  if(openSheet==="feed"||n<eatUntil)return"eat";if(n<bathUntil)return"bath";
  if(p.sleeping)return"sleep";return"home"}
document.addEventListener("pointerdown",e=>{if(musicOn&&!e.target.closest("#musicBtn")){audioInit();const c=curTrack;curTrack=null;setTrack(c||wantTrack())}},{once:true});

/* ---------- drawing (original characters) ---------- */
const PAL={
  bunny:{body:"#f4f8ff",dark:"#c9d8f2",in:"#ffc4d6"},
  fox:{body:"#ff9a3c",dark:"#d9711d",in:"#ffe0bf"},
  cat:{body:"#b9a6e8",dark:"#8f78cf",in:"#ffd0e0"},
  peng:{body:"#33507a",dark:"#22385a",in:"#f7f9fc"}
};
function face(m,dirty,sp){
  const ink="#2b3445";let s="";
  const ey=sp==="peng"?112:118;
  if(m==="sleep"){s+=`<path d="M74 ${ey} q8 7 16 0 M110 ${ey} q8 7 16 0" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  else if(m==="happy"){s+=`<path d="M74 ${ey+3} q8 -10 16 0 M110 ${ey+3} q8 -10 16 0" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`}
  else{s+=`<circle cx="82" cy="${ey}" r="8" fill="${ink}"/><circle cx="118" cy="${ey}" r="8" fill="${ink}"/><circle cx="85" cy="${ey-3}" r="3" fill="#fff"/><circle cx="121" cy="${ey-3}" r="3" fill="#fff"/>`;
    if(m==="sad")s+=`<path d="M72 ${ey-14} l14 5 M128 ${ey-14} l-14 5" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`}
  s+=`<ellipse cx="68" cy="${ey+14}" rx="9" ry="5" fill="#ff8fa8" opacity=".6"/><ellipse cx="132" cy="${ey+14}" rx="9" ry="5" fill="#ff8fa8" opacity=".6"/>`;
  const my=ey+18;
  if(sp==="peng")s+=`<path d="M92 ${my-6} l8 9 l8 -9 z" fill="#ffb02e" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(m==="happy")s+=`<path d="M91 ${my+2} q9 12 18 0 z" fill="#e2475b" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`;
  else if(m==="sad")s+=`<path d="M92 ${my+8} q8 -7 16 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if(m==="sleep")s+=`<circle cx="100" cy="${my+4}" r="3.5" fill="${ink}"/>`;
  else s+=`<path d="M92 ${my+2} q4 5 8 0 q4 5 8 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(dirty)s+=`<g fill="#8a6a4a" opacity=".55"><circle cx="66" cy="150" r="6"/><circle cx="130" cy="160" r="8"/><circle cx="112" cy="146" r="4"/><circle cx="80" cy="165" r="4"/></g>`;
  return s;
}
function petSVG(sp,m,dirty,wear){
  const c=PAL[sp],o=`stroke="#2b3445" stroke-width="4" stroke-linejoin="round"`;let b="";
  b+=`<ellipse cx="100" cy="186" rx="52" ry="8" fill="#2b3445" opacity=".15"/>`;
  if(sp==="bunny"){
    b+=`<ellipse cx="76" cy="58" rx="15" ry="40" fill="${c.body}" ${o} transform="rotate(-10 76 58)"/><ellipse cx="76" cy="62" rx="6" ry="27" fill="${c.in}" transform="rotate(-10 76 62)"/>`;
    b+=`<ellipse cx="124" cy="58" rx="15" ry="40" fill="${c.body}" ${o} transform="rotate(12 124 58)"/><ellipse cx="124" cy="62" rx="6" ry="27" fill="${c.in}" transform="rotate(12 124 62)"/>`;
    b+=`<circle cx="152" cy="160" r="12" fill="#fff" ${o}/>`;
    b+=`<ellipse cx="100" cy="132" rx="60" ry="52" fill="${c.body}" ${o}/>`;
    b+=`<g fill="#fff" stroke="#9cc3e6" stroke-width="3"><circle cx="86" cy="82" r="12"/><circle cx="114" cy="82" r="12"/><circle cx="100" cy="74" r="14"/></g><rect x="80" y="82" width="40" height="10" fill="#fff"/>`;

function mealNow(){const h=new Date().getHours();if(h>=6&&h<10)return"b";if(h>=11&&h<14)return"l";if(h>=17&&h<20)return"d";return null}

function resetMeals(p){if(p.meals.date!==today())p.meals={date:today(),b:0,l:0,d:0}}

function gainXP(p,x,quiet){
  p.xp+=x;let ups=0;const st0=stageOf(p.lv);
  while(p.xp>=need(p.lv)){p.xp-=need(p.lv);p.lv++;S.coins+=10;ups++}
  if(ups&&stageOf(p.lv)>st0){const st=STAGES[stageOf(p.lv)];setTimeout(()=>{toast(`🌟 ${p.name} 長成「${st.n}」了！`,"levelup");cheer()},quiet?1200:3000)}
  if(ups&&!quiet){sfx("level");if(backupDue())setTimeout(()=>toast("升級了！點上方「💾 該備份囉」把寵物存起來"),2800)}
  if(ups&&!quiet)toast(`${p.name} 升到 Lv.${p.lv}！金幣 +${ups*10}`,"levelup");
  return ups;
}
/* needs drop slowly while playing, and much more slowly while the game is closed
   (never below 30 while away), so pets are fine after a school day */
const RATE={h:.6,c:.4,e:.35,j:.5},AWAY=.15,FLOOR=30;
function step(p,sec,away){
  const m=sec/60,k=away?AWAY:1,dec=(key,v)=>{const nv=clamp(p[key]-v*m*k);p[key]=away?Math.max(nv,Math.min(p[key],FLOOR)):nv};
  if(p.sleeping){if(away){p.e=100;p.sleeping=false}else{p.e=clamp(p.e+sec*1.5);if(p.e>=100)p.sleeping=false}dec("h",RATE.h*.5);dec("c",RATE.c*.5)}
  else{dec("h",RATE.h);dec("c",RATE.c);dec("e",RATE.e);dec("j",(Math.min(p.h,p.c,p.e)<20?2:1)*RATE.j)}
  const avg=(p.h+p.c+p.e+p.j)/4;
  if(away)return avg>=25?gainXP(p,m*.5,true):0;
  return avg>=40?gainXP(p,m,true):0;
}
/* catch up on time away: growth counts for up to 12 hours */
let welcome=null;
function catchUp(quiet,sec){
  const away=sec!=null?sec:(Date.now()-(S.last||Date.now()))/1000;if(away<=60)return;
  const before=S.pets.map(p=>p.lv),coins=S.coins,grow=Math.min(away,12*3600);
  S.pets.forEach(p=>{for(let t=grow;t>0;t-=60)step(p,Math.min(60,t),true);if(away>grow)step(p,away-grow,true)});
  S.last=Date.now();
  if(quiet||away<20*60)return;
  welcome={away,coins:S.coins-coins,rows:S.pets.map((p,i)=>({p,up:p.lv-before[i]}))};
}

    return`<div class="task${done?" done":""}"><span class="te">${t.e}</span><div class="tm"><b>${t.n}</b><div class="tbar"><i style="width:${c/t.need*100}%"></i></div><small>${c}/${t.need}・獎勵 ${t.r} 金幣</small></div>${got?`<span class="tg">✓ 已領</span>`:`<button class="btn" data-t="${t.id}" ${done?"":"disabled"}>領取</button>`}</div>`}).join("");
  const allGot=TASKS.every(t=>d.got[t.id]);
  sheet("今日任務",`<p class="hint">每天早上重新開始。完成後按「領取」拿金幣，全部領完再送 ${ALL_BONUS} 金幣。</p><div class="tasks">${rows}</div>
<div class="task all${allGot?" done":""}"><span class="te">🎁</span><div class="tm"><b>全部完成獎勵</b><small>五個任務都領取後可以領</small></div>${d.got.all?`<span class="tg">✓ 已領</span>`:`<button class="btn" data-t="all" ${allGot?"":"disabled"}>領取</button>`}</div>`,()=>{
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{claimTask(b.dataset.t);openTasks()})},"tasks");
}

/* ---------- collection book ---------- */
const BOOK_TABS={head:"頭飾",neck:"項鍊",deco:"房間",toy:"玩具"};
const bookCount=()=>{const all=Object.keys(IT);return[all.filter(k=>S.owned[k]).length,all.length]};
function openBook(tab){tab=tab||"head";
  const list=Object.keys(IT).filter(k=>IT[k].cat===tab).sort((a,b)=>(!!IT[a].hol)-(!!IT[b].hol));
  const cards=list.map(k=>{const it=IT[k],has=S.owned[k],h=it.hol&&HOLN[it.hol];
    const how=h?`${h.e} ${h.n}限定`:`商店 ${it.price} 金幣`;
    return`<div class="item${it.hol?" hol":""}${has?"":" locked"}"><div class="pv">${has?pv(k):`<span class="unk">？</span>`}</div><span class="t">${it.n}</span><span class="d">${has?"✓ 已收集":how}</span></div>`}).join("");
  const [a,b]=bookCount(),n=list.filter(k=>S.owned[k]).length;
  sheet("收藏圖鑑",`<div class="book-sum"><b>${a}</b> / ${b} 已收集<div class="tbar"><i style="width:${a/b*100}%"></i></div></div>${segHTML(BOOK_TABS,tab)}<p class="hint">${BOOK_TABS[tab]}：${n}/${list.length}。節慶限定只能在節日時免費領，錯過要等明年喔！</p><div class="items">${cards}</div>`,()=>{
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>openBook(b.dataset.tab))},"book");
}

/* ---------- quick row (tasks + book) ---------- */
function renderQuick(){const d=daily(),done=TASKS.filter(t=>d.got[t.id]).length,ready=TASKS.some(t=>taskDone(t)&&!d.got[t.id])||(TASKS.every(t=>d.got[t.id])&&!d.got.all);
  const [a,b]=bookCount(),k=done+"|"+ready+"|"+a+"|"+TASKS.map(t=>d.c[t.id]||0).join();if(k===quickKey)return;quickKey=k;
  const tb=$("taskBtn");tb.innerHTML=`📋 今日任務 <b>${done}/${TASKS.length}</b>${ready?`<i class="dot" aria-label="有獎勵可以領"></i>`:""}`;tb.classList.toggle("ready",ready);
  $("bookBtn").innerHTML=`📖 圖鑑 <b>${a}/${b}</b>`;
}

/* ---------- welcome back ---------- */
function fmtAway(sec){const m=Math.round(sec/60);if(m<60)return`${m} 分鐘`;const h=Math.floor(m/60);if(h<24)return`${h} 小時${m%60?` ${m%60} 分`:""}`;return`${Math.floor(h/24)} 天${h%24?` ${h%24} 小時`:""}`}
function showWelcome(){const w=welcome;welcome=null;if(!w)return;
  const rows=w.rows.map(({p,up})=>{const needs=[p.h<50&&"肚子有點餓",p.c<50&&"想洗澡",p.j<50&&"想玩"].filter(Boolean);
    return`<div class="wrow">${petSVG(p.sp,"happy",false,p.wear)}<div><b>${p.name}</b> Lv.${p.lv}${up?` <span class="up">＋${up} 級</span>`:""}<small>${needs.length?needs.join("、"):"精神很好！"}</small></div></div>`}).join("");
  const d=daily(),left=TASKS.filter(t=>!d.got[t.id]).length;
  sheet("歡迎回來！",`<p class="hint">你離開了 <b>${fmtAway(w.away)}</b>，寵物們一直在等你。${w.coins?`牠們長大了，送你 <b>${w.coins}</b> 金幣！`:""}</p><div class="wlist">${rows}</div>
${left?`<p class="hint">今天還有 ${left} 個任務可以做。</p>`:""}<button class="btn" id="wOk">回小屋</button>`,close=>{$("wOk").onclick=()=>{close();cheer()}},"welcome");
}

/* ---------- mini games ---------- */
const GAMES=[
  {id:"catch",n:"接球",d:"點掉跳出來的球或玩具",e:"🎾",rate:.5},
  {id:"memory",n:"翻牌配對",d:"記住位置，把一樣的兩張翻出來",e:"🃏",rate:.5},
  {id:"whack",n:"躲貓貓",d:"寵物從洞裡探頭，快點牠！",e:"🕳️",rate:.35},
  {id:"bubble",n:"戳泡泡",d:"只戳指定顏色的泡泡",e:"🫧",rate:.35},
  {id:"cups",n:"猜杯子",d:"盯緊球在哪個杯子下面",e:"🥤",rate:1}];
function openGames(){const p=P(),d=daily();
  if(p.sleeping){toast("噓，牠在睡覺");return}
  const cards=GAMES.map(g=>`<button class="gcard" data-g="${g.id}"><span class="ge">${g.e}</span><b>${g.n}</b><small>${g.d}</small><small class="best">最高分 ${(S.best&&S.best[g.id])||0}</small></button>`).join("");
  sheet(`和 ${p.name} 玩什麼？`,`<p class="hint">玩小遊戲可以賺金幣、經驗和快樂。今天小遊戲金幣：<b>${d.gc}/${GAME_CAP}</b>${d.gc>=GAME_CAP?"（今天的金幣拿滿了，還是可以玩）":""}</p><div class="glist">${cards}</div>`,close=>{
    document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      if(P().e<15){toast(`${P().name} 太累了，先哄牠睡一下`);return}
      close();const id=b.dataset.g;if(id==="catch")startCatch();else startGame(id)})},"games");
}
function finishGame(id,score){const p=P(),g=GAMES.find(x=>x.id===id),d=daily();
  const coins=Math.max(0,Math.min(Math.floor(score*g.rate),GAME_CAP-d.gc)),xp=Math.min(Math.round(score*2),60);
  d.gc+=coins;S.coins+=coins;S.best=S.best||{};const nb=score>(S.best[id]||0);if(nb)S.best[id]=score;
  p.j=clamp(p.j+Math.min(score*2,25));p.e=clamp(p.e-6);if(xp)gainXP(p,xp);if(score>0)track("game");
  gaming=false;busy=false;save();
  sheet("遊戲結束",`<div class="result"><span class="ge">${g.e}</span><b>${g.n}</b><div class="rs">得分 <strong>${score}</strong>${nb&&score?`<span class="nb">新紀錄！</span>`:""}</div>
<div class="rw"><span>金幣 +${coins}</span><span>經驗 +${xp}</span><span>快樂 +${Math.min(score*2,25)}</span></div>${d.gc>=GAME_CAP?`<p class="hint">今天小遊戲的金幣已經拿滿 ${GAME_CAP} 個，明天再來！</p>`:""}</div>
<div class="btn-row"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="home">回小屋</button></div>`,close=>{
    $("again").onclick=()=>{if(P().e<15){toast(`${P().name} 太累了，先哄牠睡一下`);return}close();id==="catch"?startCatch():startGame(id)};
    $("home").onclick=()=>{close();cheer()}},"result");
  if(score)sfx("level");
}
function startGame(id){const g=GAMES.find(x=>x.id===id);busy=true;gaming=true;
  let cleanup=null,ended=false;
  const done=score=>{if(ended)return;ended=true;cleanup&&cleanup();cleanup=null;finishGame(id,score)};
  sheet(`${g.e} ${g.n}`,`<div class="ghud" id="gHud"></div><div class="garea g-${id}" id="gArea"></div>`,()=>{
    try{cleanup=GAME_FN[id]($("gArea"),$("gHud"),done)}catch(e){done(0)}
    return()=>{if(!ended){ended=true;cleanup&&cleanup();busy=false;gaming=false;save()}}},"game");
}
const timers=()=>{const ts=[],is=[];return{t:(f,ms)=>{const x=setTimeout(f,ms);ts.push(x);return x},i:(f,ms)=>{const x=setInterval(f,ms);is.push(x);return x},clear:()=>{ts.forEach(clearTimeout);is.forEach(clearInterval)}}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GAME_FN={
  memory(area,hud,done){const T=timers();let left=60,pairs=0,moves=0,open=[],lock=false;
    const ids=shuffle(["t_yarn","t_soccer","t_duck","t_lantern","t_mooncake","t_candy","t_snowman"]).slice(0,6);
    const deck=shuffle([...ids,...ids]);
    area.innerHTML=deck.map((k,i)=>`<button class="mcard" data-i="${i}" aria-label="牌"><span class="back"></span><span class="front">${toyIc(k)}</span></button>`).join("");
    const upd=()=>{hud.textContent=`剩 ${left} 秒・配對 ${pairs}/6・翻了 ${moves} 次`};upd();
    const cards=[...area.querySelectorAll(".mcard")];
    const finish=()=>done(pairs*2+Math.floor(left/6));
    cards.forEach(c=>c.addEventListener("pointerdown",e=>{e.preventDefault();if(lock||c.classList.contains("show"))return;
      c.classList.add("show");sfx("pop");open.push(c);
      if(open.length===2){moves++;const[a,b]=open;open=[];
        if(deck[a.dataset.i]===deck[b.dataset.i]){pairs++;a.classList.add("ok");b.classList.add("ok");upd();cheer();if(pairs===6)T.t(finish,500)}
        else{lock=true;T.t(()=>{a.classList.remove("show");b.classList.remove("show");lock=false},700)}}
      upd()}));
    T.i(()=>{left--;upd();if(left<=0)finish()},1000);
    return T.clear},
  whack(area,hud,done){const T=timers();let left=20,score=0;const p=P();
    area.innerHTML=Array.from({length:9},(_,i)=>`<div class="hole"><button class="peek" data-i="${i}" aria-label="探頭的寵物"></button></div>`).join("");
    const peeks=[...area.querySelectorAll(".peek")],face=petSVG(p.sp,"happy",false,p.wear),coin=`<span class="gold">★</span>`;
    const upd=()=>{hud.textContent=`剩 ${left} 秒・抓到 ${score} 分`};upd();
    peeks.forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();if(!b.classList.contains("up"))return;
      b.classList.remove("up");clearTimeout(b._t);const pts=b._gold?3:1;score+=pts;sfx("pop");upd();if(b._gold)toast("金星 +3！")}));
    const pop=()=>{const free=peeks.filter(b=>!b.classList.contains("up"));if(!free.length)return;const b=free[Math.floor(Math.random()*free.length)];
      b._gold=Math.random()<.15;b.innerHTML=b._gold?coin:face;b.classList.add("up");const stay=Math.max(550,1000-(20-left)*20);b._t=T.t(()=>b.classList.remove("up"),stay)};
    T.i(pop,650);T.t(pop,200);
    T.i(()=>{left--;upd();if(left<=0)done(score)},1000);
    return T.clear},
  bubble(area,hud,done){const T=timers();let left=25,score=0;
    const COL=[["粉紅","#ff8fb1"],["藍色","#6cb8f0"],["黃色","#ffd35c"],["綠色","#6fcf86"]];let target=0;
    const upd=()=>{hud.innerHTML=`剩 ${left} 秒・${score} 分・只戳 <span class="tdot" style="background:${COL[target][1]}"></span><b>${COL[target][0]}</b>`};
    const newTarget=()=>{let n;do{n=Math.floor(Math.random()*4)}while(n===target);target=n;upd();floatIn(`換戳${COL[target][0]}！`)};
    const floatIn=t=>{const f=document.createElement("div");f.className="gfloat";f.textContent=t;area.appendChild(f);T.t(()=>f.remove(),1200)};
    upd();
    const spawn=()=>{const c=Math.random()<.4?target:Math.floor(Math.random()*4),b=document.createElement("button"),sz=46+Math.random()*18;
      b.className="bub";b.setAttribute("aria-label",COL[c][0]+"泡泡");b.style.cssText=`left:${4+Math.random()*78}%;width:${sz}px;height:${sz}px;background:radial-gradient(circle at 32% 30%,#fff 0 12%,${COL[c][1]} 13% 100%);animation-duration:${3.2+Math.random()*1.4}s`;
      b.addEventListener("pointerdown",e=>{e.preventDefault();if(b._hit)return;b._hit=1;b.classList.add("popd");T.t(()=>b.remove(),180);
        if(c===target){score++;sfx("pop")}else{score=Math.max(0,score-1);floatIn("戳錯了 -1")}upd()});
      b.addEventListener("animationend",e=>{if(e.animationName==="rise2")b.remove()});area.appendChild(b)};
    T.i(spawn,480);T.i(newTarget,6000);
    T.i(()=>{left--;upd();if(left<=0)done(score)},1000);
    return T.clear},
  cups(area,hud,done){const T=timers();let round=0,score=0,slots=[0,1,2],ball=1,canPick=false;
    area.innerHTML=[0,1,2].map(i=>`<button class="cup" data-c="${i}" aria-label="杯子 ${i+1}"><span class="cball"></span><svg class="cupi" viewBox="0 0 60 64"><path d="M8 6 h44 l-7 54 h-30 z" fill="#ff7a59" stroke="#2b3445" stroke-width="3.5" stroke-linejoin="round"/><path d="M12 18 h36" stroke="#fff" stroke-width="5" opacity=".7"/></svg></button>`).join("");
    const cups=[...area.querySelectorAll(".cup")],X=[8,38,68];
    const place=ms=>cups.forEach((c,i)=>{c.style.transitionDuration=ms+"ms";c.style.left=X[slots[i]]+"%"});
    const upd=t=>{hud.textContent=`第 ${Math.min(round+1,3)}/3 回合・${score} 分${t?"・"+t:""}`};
    place(0);
    const lift=(list,on)=>list.forEach(c=>c.classList.toggle("lift",on));
    const play=()=>{canPick=false;ball=Math.floor(Math.random()*3);cups.forEach((c,i)=>c.classList.toggle("has",i===ball));
      upd("看清楚球在哪");lift([cups[ball]],true);
      T.t(()=>{lift(cups,false);const n=[4,6,8][round],sp=[480,380,300][round];let k=0;
        T.t(function sw(){const a=Math.floor(Math.random()*3);let b;do{b=Math.floor(Math.random()*3)}while(b===a);
          [slots[a],slots[b]]=[slots[b],slots[a]];place(sp);sfx("pop");
          if(++k<n)T.t(sw,sp+60);else T.t(()=>{canPick=true;upd("球在哪個杯子下面？")},sp+80)},500)},1100)};
    cups.forEach((c,i)=>c.addEventListener("pointerdown",e=>{e.preventDefault();if(!canPick)return;canPick=false;
      lift(cups,true);const ok=i===ball;if(ok){score+=3;cheer()}upd(ok?"答對了！+3":"猜錯了");
      T.t(()=>{lift(cups,false);round++;if(round>=3)T.t(()=>done(score),500);else T.t(play,600)},1300)}));
    T.t(play,500);
    return T.clear}
};

/* ---------- loop ---------- */
$("musicBtn").onclick=()=>{if(musicOn&&!actx){setMusic(true);render();return}setMusic(!musicOn);render()};
$("musicBtn").setAttribute("aria-pressed",musicOn);$("musicLbl").textContent=musicOn?"音樂開":"音樂關";
$("taskBtn").onclick=()=>{if(!busy)openTasks()};
$("bookBtn").onclick=()=>{if(!busy)openBook()};
renderTabs();render();
if(welcome)setTimeout(showWelcome,400);
let t0=Date.now();
setInterval(()=>{const now=Date.now(),dt=(now-t0)/1000;t0=now;if(dt<=0)return;
  if(dt>90){catchUp(busy,dt);lastKey="";renderTabs();render();if(welcome&&!openSheet)showWelcome();welcome=null;save();return}
  S.pets.forEach(p=>{const was=p.sleeping;const ups=step(p,dt,document.hidden);
    if(ups&&p===P()){toast(`${p.name} 長大了！Lv.${p.lv}，金幣 +${ups*10}`,"levelup");sfx("level")}
    if(was&&!p.sleeping&&p===P()){toast(`${p.name} 睡飽飽，醒來了！`);lastKey=""}});
  if(!document.hidden)render();},1000);
setInterval(save,5000);
document.addEventListener("visibilitychange",()=>{if(document.hidden){save();if(actx)actx.suspend()}else{if(actx&&musicOn)actx.resume();render()}});
})();
</script>

</body>
